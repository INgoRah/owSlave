; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
;default_envs=attiny85
;default_envs=simulation
default_envs=attiny84-bl
	attiny84-boot
	attiny84-dual-dht
	attiny84-dual-adc
	attiny85-boot
	attiny85
	atmega88-boot
	atmega88
	atmega168-bl
	atmega168-boot
;default_envs=atmega168-boot
;attiny84-dual-bmp

; all environments: DEFAULT_OWID_ADR / DEFAULT_OWID_BUS from the
; environment (OWID_ADR, OWID_BUS; 0x5 and 0x1 without), see owid.py.
; With board_fuses.lfuse/hfuse given, the fuses target takes the lock
; bits only from board_fuses.lock_bits, empty else (-Ulock:w::m).
[env]
extra_scripts = pre:owid.py

[common]
; switch as compare chains: jump tables cost flash on the small parts
build_flags = -fpack-struct
	-fno-jump-tables
	-fshort-enums
	-funsigned-char
	-funsigned-bitfields
	-D_DIS_FLASH_
	-D_NO_BOOTLOADER_PIN_
	-Wmissing-format-attribute
	-Wformat-security
	-Wmissing-declarations
	-Winit-self
	-Wundef
	-Waggregate-return
	-Wcast-align
	-Wwrite-strings
	-Wformat-nonliteral
	-Wswitch-enum
	-Winline
	-Wshadow

build_cfg_flags = -DWDT_ENABLED
upload_port = /dev/ttyACM0
upload_flags = -P/dev/ttyACM0
upload_protocol = stk500v2
monitor_port = /dev/ttyUSB2
monitor_speed = 19200

; ATtiny84 / ATtiny85 with the 1-Wire bootloader, as the ATmega168
; above: no boot section, the bootloader keeps 1600 bytes at the end of
; the flash (0x19C0, the last page for itself) and patches the reset vector, see owbootloader.h. It
; programs the flash itself: SELFPRGEN (efuse 0xFE).
; pio run -e attiny84-bl && pio run -e attiny84-boot -t fuses -t upload
[env:attiny84-bl]
; the upload writes the bootloader as well, see bootloader/app_bl.py
custom_bl_env = attiny84-boot
extra_scripts = ${env.extra_scripts}
	bootloader/app_bl.py
platform = atmelavr
board = attiny84
board_build.mcu = attiny84
board_upload.maximum_size = 6592
build_flags = ${common.build_flags} ${common.build_cfg_flags}
	-DMAX_BTN=8 -DWDT_SAVE -DOWID_CHECK
	-DBL_SUPPORT
	;-DTIMER_SUPPORT
	;-DDUAL_ROM -DDS2450_SUPPORT
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
upload_port = ${common.upload_port}
debug_tool = simavr
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
board_fuses.hfuse = 0xD5
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.efuse = 0xFE

[env:attiny84-dual-bmp]
; current no longer verified
platform = atmelavr
board = attiny84
board_build.mcu = attiny84
build_flags = ${common.build_flags}
	${common.build_cfg_flags}
	-DDUAL_ROM -DDS1820_SUPPORT
	-DBMP280_SUPPORT -DI2C_MASTER
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
board_fuses.hfuse = 0xD5
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
debug_tool = simavr
monitor_speed = 115200
monitor_port = /dev/ttyUSB0

[env:attiny84-dual-dht]
; the upload writes the bootloader as well, see bootloader/app_bl.py
custom_bl_env = attiny84-boot
extra_scripts = ${env.extra_scripts}
	bootloader/app_bl.py
platform = atmelavr
board = attiny84
board_build.mcu = attiny84
board_upload.maximum_size = 6592
build_flags = ${common.build_flags}
	${common.build_cfg_flags}
	-DDUAL_ROM -DDS1820_SUPPORT
	-DDHT22_SUPPORT
	-DOWID_CHECK
	-DBL_SUPPORT
	-DWDT_SAVE
	;-DTIMER_SUPPORT
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
board_fuses.hfuse = 0xD5
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.efuse = 0xFE
debug_tool = simavr

[env:attiny84-dual-adc]
; the upload writes the bootloader as well, see bootloader/app_bl.py
custom_bl_env = attiny84-boot
extra_scripts = ${env.extra_scripts}
	bootloader/app_bl.py
platform = atmelavr
board = attiny84
board_build.mcu = attiny84
board_upload.maximum_size = 6592
build_flags = ${common.build_flags} ${common.build_cfg_flags}
	-DDUAL_ROM -DDS2450_SUPPORT
	-DOWID_CHECK
	-DBL_SUPPORT
	-DWDT_SAVE
	;-DTIMER_SUPPORT ; adds 1200 bytes
upload_protocol = ${common.upload_protocol}
upload_flags = -P/dev/ttyACM0
upload_port = ${common.upload_port}
debug_tool = simavr
monitor_speed = 115200
monitor_port = /dev/ttyUSB0
board_fuses.hfuse = 0xD5
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.efuse = 0xFE

[env:atmega88-boot]
platform = atmelavr
board = ATmega88
board_build.f_cpu = 8000000UL
board_build.mcu = atmega88p
build_src_filter = -<*> +<../bootloader/>
build_flags = -Os
custom_bl_start = 0x1800
custom_bl_end = 0x2000
custom_bl_app_env = atmega88
extra_scripts = ${env.extra_scripts}
	bootloader/bl_env.py
upload_protocol = ${common.upload_protocol}
upload_port = ${common.upload_port}
; the fuses target takes these as well, the port only from here
upload_flags = ${common.upload_flags}
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.hfuse = 0xD5
board_fuses.efuse = 0xF8

; ATmega88 with the 1-Wire bootloader (env atmega88-boot), as the
; ATmega168 below: the boot section (2 KB at 0x1800) stays free.
; pio run -e atmega88 && pio run -e atmega88-boot -t fuses -t upload
[env:atmega88]
platform = atmelavr
board = ATmega88
board_build.f_cpu = 8000000UL
board_build.mcu = atmega88p #atmega168 #atmega88p #
#board_upload.maximum_size = 6144
build_flags = ${common.build_flags} ${common.build_cfg_flags}
	-DMAX_BTN=8
	#-DBL_SUPPORT
	-DDUAL_ROM -DDS2450_SUPPORT
	-DWDT_SAVE
	-DTIMER_SUPPORT ; adds 1300 bytes
	;-DHAVE_UART -DLIGHTPRINTF -DPRINT_SUPPORT
	;-DDEBUG
	;-DWITH_LEDS -DDHT22_SUPPORT
test_build_src = yes
upload_protocol = ${common.upload_protocol}
upload_port = ${common.upload_port}
upload_flags = -e
upload_speed = 9600
#${common.upload_flags}
monitor_speed = 19200
#9600
monitor_port = /dev/ttyUSB1
; fuse bits are active low: 0 = programmed (on), 1 = unprogrammed (off)
; lfuse 0xE2 = 1110 0010
;   [7]   CKDIV8   1: clock not divided by 8, runs at the full 8 MHz
;   [6]   CKOUT    1: no clock output on CLKO (PB0)
;   [5:4] SUT     10: longest start-up, 6 CK + 14 CK + 64 ms, for a
;                     slowly rising supply
;   [3:0] CKSEL 0010: internal calibrated RC oscillator, 8 MHz
board_fuses.lfuse = 0xE2
; 0xFF: no lock, flash and EEPROM can be read and written by ISP, and
; SPM/LPM are not restricted in either the application or boot section
board_fuses.lock_bits = 0xFF
; hfuse 0xD5 = 1101 0101
;   [7]   RSTDISBL 1: PC6 is the reset pin (ISP stays possible)
;   [6]   DWEN     1: debugWIRE off
;   [5]   SPIEN    0: serial (ISP) programming enabled
;   [4]   WDTON    1: watchdog not forced on, the firmware controls it
;   [3]   EESAVE   0: EEPROM kept on chip erase (the 1-Wire ID and
;                     config survive an ISP upload)
;   [2:0] BODLEVEL 101: brown-out reset at 2.7 V
board_fuses.hfuse = 0xD5
; efuse 0xF8 = 1111 1000
;   [7:3] unused, read as 1
;   [2:1] BOOTSZ  00: largest boot section, 1024 words (2 KB) from byte
;                     0x1800 (word 0xC00), see atmega88-boot
;   [0]   BOOTRST  0: reset jumps to the boot loader, not to 0x0000
board_fuses.efuse = 0xF8

; ATmega168 with the 1-Wire bootloader (env atmega168-boot): the
; application leaves the boot section (2 KB) free and can enter it,
; see include/owbootloader.h. Updated over the bus (in10dfs), by ISP
; only together with the bootloader (env atmega168-boot): an ISP upload
; erases the chip, a page cannot be written again without.
[env:atmega168-bl]
; the upload writes the bootloader as well, see bootloader/app_bl.py
custom_bl_env = atmega168-boot
extra_scripts = ${env.extra_scripts}
	bootloader/app_bl.py
platform = atmelavr
board = ATmega168
board_build.f_cpu = 8000000UL
board_build.mcu = atmega168
board_upload.maximum_size = 14336
build_flags = ${common.build_flags} ${common.build_cfg_flags}
	-DMAX_BTN=8
	-DWDT_SAVE
	-DBL_SUPPORT
	-DTIMER_SUPPORT
	-DDUAL_ROM -DDS2450_SUPPORT
	-DHAVE_UART -DLIGHTPRINTF -DPRINT_SUPPORT
	-DOWID_CHECK
upload_protocol = ${common.upload_protocol}
upload_port = ${common.upload_port}
upload_flags = ${common.upload_flags}

; the bootloader itself, for the boot section at 0x3800 (BOOTSZ = 1024
; words, BOOTRST: efuse 0xF8). Its upload writes the application of
; custom_bl_app_env as well (build that first), the fuses target erases
; the chip:
; pio run -e atmega168 && pio run -e atmega168-boot -t fuses -t upload
[env:atmega168-boot]
platform = atmelavr
board = ATmega168
board_build.f_cpu = 8000000UL
board_build.mcu = atmega168
build_src_filter = -<*> +<../bootloader/>
build_flags = -Os
custom_bl_start = 0x3800
custom_bl_end = 0x4000
custom_bl_app_env = atmega168
extra_scripts = ${env.extra_scripts}
	bootloader/bl_env.py
upload_protocol = ${common.upload_protocol}
upload_port = ${common.upload_port}
; the fuses target takes these as well, the port only from here
upload_flags = ${common.upload_flags}
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.hfuse = 0xD5
board_fuses.efuse = 0xF8

[env:attiny84-boot]
platform = atmelavr
board = attiny84
board_build.mcu = attiny84
build_src_filter = -<*> +<../bootloader/>
build_flags = -Os
custom_bl_start = 0x19C0
custom_bl_end = 0x1FC0
custom_bl_app_env = attiny84-bl
extra_scripts = ${env.extra_scripts}
	bootloader/bl_env.py
upload_protocol = ${common.upload_protocol}
upload_port = ${common.upload_port}
upload_flags = ${common.upload_flags}
; fuse bits are active low: 0 = programmed (on), 1 = unprogrammed (off)
; hfuse 0xD5 = 1101 0101
;   [7]   RSTDISBL 1: PB3 is the reset pin (ISP stays possible)
;   [6]   DWEN     1: debugWIRE off
;   [5]   SPIEN    0: serial (ISP) programming enabled
;   [4]   WDTON    1: watchdog not forced on, the firmware controls it
;   [3]   EESAVE   0: EEPROM kept on chip erase (the 1-Wire ID and
;                     config survive an ISP upload)
;   [2:0] BODLEVEL 101: brown-out reset at 2.7 V
board_fuses.hfuse = 0xD5
; lfuse 0xE2 = 1110 0010
;   [7]   CKDIV8   1: clock not divided by 8, runs at the full 8 MHz
;   [6]   CKOUT    1: no clock output on CKOUT (PB2)
;   [5:4] SUT     10: longest start-up, 6 CK + 14 CK + 64 ms, for a
;                     slowly rising supply
;   [3:0] CKSEL 0010: internal calibrated RC oscillator, 8 MHz
board_fuses.lfuse = 0xE2
; 0xFF: LB2..1 = 11, no lock, flash and EEPROM can be read and written
; by ISP
board_fuses.lock_bits = 0xFF
; efuse 0xFE = 1111 1110
;   [7:1] unused, read as 1
;   [0]   SELFPRGEN 0: SPM enabled, the bootloader can write the flash
;                      (the ATtiny has no boot section or BOOTRST: the
;                      bootloader puts an rjmp to itself at 0x19C0 into
;                      the reset vector and keeps the application's own)
board_fuses.efuse = 0xFE

[env:attiny85]
; the upload writes the bootloader as well, see bootloader/app_bl.py
custom_bl_env = attiny85-boot
extra_scripts = ${env.extra_scripts}
	bootloader/app_bl.py
platform = atmelavr
board = attiny85
board_build.mcu = attiny85
board_upload.maximum_size = 6592
build_flags = ${common.build_flags} ${common.build_cfg_flags}
	-DTIMER_SUPPORT
	-DBL_SUPPORT
	-DWDT_SAVE
	-DOWID_CHECK
upload_protocol = ${common.upload_protocol}
upload_flags = ${common.upload_flags}
upload_port = ${common.upload_port}
board_fuses.hfuse = 0xD5
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.efuse = 0xFE

[env:attiny85-boot]
platform = atmelavr
board = attiny85
board_build.mcu = attiny85
build_src_filter = -<*> +<../bootloader/>
build_flags = -Os
custom_bl_start = 0x19C0
custom_bl_end = 0x1FC0
custom_bl_app_env = attiny85
extra_scripts = ${env.extra_scripts}
	bootloader/bl_env.py
upload_protocol = ${common.upload_protocol}
upload_port = ${common.upload_port}
upload_flags = ${common.upload_flags}
board_fuses.hfuse = 0xD5
board_fuses.lfuse = 0xE2
board_fuses.lock_bits = 0xFF
board_fuses.efuse = 0xFE

[env:simulation]
platform = atmelavr
;framework = arduino
;board = atmega168
board = ATmega168
debug_tool = simavr
;board_build.mcu = atmega328
board_build.mcu = atmega168
extra_scripts = ${env.extra_scripts}
	simavr.py
test_build_src = no
; --without-uploading
test_testing_command =
    simavr
    -m ${board}
    -f 8000000L
    ${platformio.build_dir}/${this.__env__}/firmware.elf
;test_transport = native
build_flags = ${common.build_flags} -Og -ggdb3 -g3 -DAVRSIM
	-DMAX_BTN=8 -DTIMER_SUPPORT
	-DHAVE_UART -DPRINT_SUPPORT -DDEBUG
	-I/home/ingo/Documents/Projects/simavr/simavr/sim/avr/
# -DHAVE_UART -DLIGHTPRINTF
# debug_init_break =
debug_build_flags = -Og -ggdb3 -g2
#-Og -ggdb3 -g3debug
